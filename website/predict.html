<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predict</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-image: url('HD-Quattro-2 (1).webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
        }

        .upload {
            width: min(440px, 90vw);
            padding: 30px;
            border-radius: 8px;
            background-color: rgba(0, 0, 0, 0.7);
            color: floralwhite;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            color: red;
            font-style: italic;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .btn-warning {
            position: relative;
            display: inline-block;
            padding: 11px 24px;
            font-size: 15px;
            line-height: 1.5;
            border-radius: 3px;
            border: 0;
            background-color: green;
            color: black;
            cursor: pointer;
        }

        .btn-warning:hover {
            background: yellow;
        }

        .btn-warning:focus-visible,
        .btn-warning:focus-within {
            outline: 3px solid yellow;
            outline-offset: 2px;
        }

        .btn-warning:disabled {
            background: green;
            opacity: 0.5;
            cursor: default;
        }

        /* Hidden visually but still reachable with the keyboard */
        input[type="file"] {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            overflow: hidden;
        }

        #preview {
            width: 160px;
            height: 160px;
            object-fit: contain;
            background: white;
            border-radius: 4px;
        }

        #preview[hidden] {
            display: none;
        }

        #result {
            min-height: 1.5em;
            font-size: 20px;
        }

        a {
            color: yellow;
        }
    </style>
</head>

<body>

    <div class="upload">
        <h1>Prediction</h1>
        <form id="upload-form">
            <label class="btn-warning">
                Upload Traffic Sign
                <input type="file" name="file" id="file" accept="image/*">
            </label>
            <img id="preview" alt="Selected traffic sign" hidden>
            <button type="submit" class="btn-warning" id="predict" disabled>Predict</button>
        </form>
        <p id="result" aria-live="polite"></p>
        <a href="home.html">Back to Home</a>
    </div>

    <script>
        const MAX_UPLOAD_MB = 20;
        const form = document.getElementById('upload-form');
        const fileInput = document.getElementById('file');
        const preview = document.getElementById('preview');
        const predictButton = document.getElementById('predict');
        const result = document.getElementById('result');

        fileInput.addEventListener('change', () => {
            const file = fileInput.files[0];
            result.textContent = '';
            if (!file) return;
            preview.src = URL.createObjectURL(file);
            preview.hidden = false;
            predictButton.disabled = false;
        });

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            if (fileInput.files[0].size > MAX_UPLOAD_MB * 1024 * 1024) {
                result.textContent = `That image is too large (the limit is ${MAX_UPLOAD_MB} MB)`;
                return;
            }
            predictButton.disabled = true;
            result.textContent = 'Predicting...';

            let response;
            try {
                response = await fetch('/predict', { method: 'POST', body: new FormData(form) });
            } catch (error) {
                result.textContent = 'Could not reach the prediction server. Is Traffic_app.py running?';
                predictButton.disabled = false;
                return;
            }

            const data = await response.json().catch(() => null);
            if (response.ok && data) {
                const percent = Math.round(data.confidence * 100);
                result.textContent = data.recognised
                    ? `Predicted Traffic 🚦 Sign is: ${data.sign} (${percent}% confidence)`
                    : `No traffic sign recognised (best guess: ${data.sign}, ${percent}% confidence). Try a close-up of a single sign.`;
            } else {
                result.textContent = data?.error
                    || `The prediction server hit an error (${response.status}). Check the terminal running Traffic_app.py.`;
            }
            predictButton.disabled = false;
        });
    </script>

</body>

</html>
